<html lang="en">

	<head>
		<meta charset="UTF-8">

		<!--This returns ./styles.css-->
		<link href="/dev/entomologist/css" rel="stylesheet">
		<meta content="width=device-width, initial-scale=1.0" name="viewport">

		<!--In the rendered file, this script is a minified version of ./script.js-->
		<script>
		</script>
		<title>Entomologist</title>
	</head>

	<body>
		<header>
			<nav>
				<a class="title" href="#">
					Entomologist UI
				</a>
			</nav>
		</header>
		<main class="items-center flex flex-col w-full">
			<section>
				<table class="w-full text-sm text-left rtl:text-right table-fixed">

					<!--Table head-->
					<thead class="text-xs uppercase bg-underwater_blue">
						<tr>
							<th class="id" scope="col">
								Id
							</th>
							<th class="level" scope="col">
								Level
							</th>
							<th scope="col">
								Message
							</th>
							<th class="occurrence" scope="col">
								Last_occurrence
							</th>
						</tr>
					</thead>

					<!--Table body-->
					<tbody>

						<!--Example row-->
						<tr class="border-b bg-gray-900">

							<!--ID Column-->
							<td class="id" scope="row">3</td>

							<!--Example row (n-th level)-->
							<td scope="row">
								<div class="flex-row">

									<!--Text-->
									<div class="block" id="nlevel">"info"</div>

									<!--Copy button-->
									<button onclick="copy('0level')">
										<i class="fa fa-copy"></i>
									</button>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</section>
		</main>
	</body>
</html>
