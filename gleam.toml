name = "entomologist_extensions"
version = "0.0.0"

description = "🧰🐛 Useful extensions for entomologist"
licences = ["Apache-2.0"]
repository = { type = "github", user = "DisguisedPigeon", repo = "entomologist-extensions" }
links = [{ title = "Entomologist", href = "https://www.github.com/DisguisedPigeon/entomologist" }]

target = "erlang"


[dependencies]
entomologist = { git = "https://github.com/DisguisedPigeon/entomologist.git", ref="main" }
lustre = ">= 5.1.1 and < 6.0.0"
wisp = ">= 1.7.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
mist = ">= 4.0.7 and < 5.0.0"
gleam_json = ">= 3.0.1 and < 4.0.0"
pog = ">= 3.2.0 and < 4.0.0"
gleam_erlang = ">= 0.34.0 and < 1.0.0"
gleam_stdlib = ">= 0.60.0 and < 1.0.0"

[dev-dependencies]
gleeunit = ">= 1.5.1 and < 2.0.0"
